# UTN Assistant — source configuration (UTN-FRBA, Ing. en Sistemas de Información)
#
# Scope: current version is restricted to UTN-FRBA, Departamento de Ingeniería
# en Sistemas de Información (FR-028). No other regionales/departments.
# Sources below are derived from the "Contexto Chatbot" document, keeping only
# public, static, indexable HTML pages under frba.utn.edu.ar (FR-011, FR-012).
#
# Fields per source:
#   id                  - Stable identifier (slug, unique).
#   url                 - Public page or section URL.
#   title_hint          - Optional human-readable title hint.
#   area                - One of: ACADEMICA, ADMINISTRATIVA, BIENESTAR, EXTENSION
#   regional            - Optional regional name (e.g. "Regional Buenos Aires").
#   department          - Optional department name.
#   source_type         - WEB (only supported type in v1).
#   active              - Whether this source is included in update runs.
#   requires_javascript - Set to true only for pages that need browser rendering.
#   crawl_delay_seconds - Optional per-source override; defaults to global setting.
#   include_patterns    - Optional list of URL path patterns to include.
#   exclude_patterns    - Optional list of URL path patterns to exclude.
#
# NOTE on excluded PDF entries (kept out on purpose, see chat 2026-07-10):
#   - SIU Guaraní (guarani.frba.utn.edu.ar): login/JS app, not static HTML;
#     scraping conflicts with FR-012 and likely robots.txt. Left as active:false.
#   - YouTube charla informativa: multimedia, not an indexable WEB source.
#   - Emails/phones/office rooms: contact data, not URLs — not sources.

