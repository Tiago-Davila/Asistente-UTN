# UTN Assistant — Local Docker Compose stack
#
# Services:
#   chromadb  — persistent vector store
#   ollama    — local LLM inference
#   api       — FastAPI query/admin service
#
# The scraper and processor are NOT standalone workers here.
# Indexing is triggered via the API:
#   POST /index/rebuild   — full rebuild or incremental update
#   DELETE /index         — clear the index
#
# Quick start:
#   cd utn-assistant
#   cp .env.example .env
#   cp config/sources.example.yaml infra/sources.yaml
#   cd infra
#   docker compose up -d chromadb ollama
#   docker compose exec ollama ollama pull llama3
#   docker compose up -d api
#
# Then trigger indexing:
#   curl -X POST http://localhost:8000/index/rebuild \
#        -H "Content-Type: application/json" \
#        -d '{"mode": "FULL_REBUILD"}'

services:

  # --------------------------------------------------------------------------
  # ChromaDB — persistent vector store
  # --------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Ollama — local LLM inference (OpenAI-compatible API)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # GPU support — uncomment if NVIDIA runtime is available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --------------------------------------------------------------------------
  # API — FastAPI service
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Override paths to point at container-internal locations
      CHROMADB_PATH: /data/chromadb
      OLLAMA_BASE_URL: http://ollama:11434/v1
      SOURCES_CONFIG_PATH: /app/config/sources.yaml
    volumes:
      - chromadb_data:/data/chromadb
      - ./sources.yaml:/app/config/sources.yaml:ro
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  chromadb_data:
    driver: local
  ollama_models:
    driver: local
