# UTN Assistant — Local Docker Compose stack
#
# Services:
#   chromadb  — persistent vector store
#   api       — FastAPI query/admin service
#
# Ollama corre localmente (instalado en el host, no en Docker).
# La API lo alcanza via host.docker.internal:11434.
#
# The scraper and processor are NOT standalone workers here.
# Indexing is triggered via the API:
#   POST /index/rebuild   — full rebuild or incremental update
#   DELETE /index         — clear the index
#
# Quick start:
#   cd infra
#   docker compose up -d chromadb
#   docker compose up -d api
#
# Then trigger indexing:
#   curl -X POST http://localhost:8000/index/rebuild \
#        -H "Content-Type: application/json" \
#        -d '{"mode": "FULL_REBUILD"}'

services:

  # --------------------------------------------------------------------------
  # ChromaDB — persistent vector store
  # --------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # API — FastAPI service
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Override paths to point at container-internal locations
      CHROMADB_PATH: /data/chromadb
      # Ollama corre en el host, no en Docker
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      SOURCES_CONFIG_PATH: /app/config/sources.yaml
    volumes:
      - chromadb_data:/data/chromadb
      - ./sources.yaml:/app/config/sources.yaml:ro
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  chromadb_data:
    driver: local
