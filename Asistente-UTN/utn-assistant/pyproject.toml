[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "utn-assistant"
version = "0.1.0"
description = "UTN institutional RAG assistant — local web service with scraper, processor, and query API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # HTTP client
    "httpx>=0.27.0",
    # HTML scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Browser-based scraping (JS-dependent sources)
    "playwright>=1.44.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Vector store
    "chromadb>=0.5.0",
    # YAML configuration loading
    "pyyaml>=6.0.1",
    # robots.txt parsing
    "robotparser; python_version < '3.0'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # async test client
    "anyio[trio]>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "config*", "processor*", "rag*", "scraper*", "vectorstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
source = ["api", "config", "processor", "rag", "scraper", "vectorstore"]
omit = ["tests/*", "infra/*"]
